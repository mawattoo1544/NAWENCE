    <path d="M4 28V6C4 4.89543 4.89543 4 6 4H10C11.1046 4 12 4.89543 12 6V28C12 29.1046 11.1046 30 10 30H6C4.89543 30 4 29.1046 4 28Z" fill="url(#logo-grad-b)" />
    
