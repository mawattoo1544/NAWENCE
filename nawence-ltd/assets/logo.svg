<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40" fill="none">
  <defs>
    <linearGradient id="logo-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" />
      <stop offset="100%" stop-color="#20D6C7" />
    </linearGradient>
    <linearGradient id="logo-grad-b" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B38EA" />
      <stop offset="100%" stop-color="#7C5CFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric N Emblem -->
  <g transform="translate(4, 4)">
