    <path d="M10 4H14.5L24.5 24H20L10 4Z" fill="url(#logo-grad-a)" />
    
    <!-- Right Column -->
    <path d="M20 28V6C20 4.89543 20.8954 4 22 4H26C27.1046 4 28 4.89543 28 6V28C28 29.1046 27.1046 30 26 30H22C20.8954 30 20 29.1046 20 28Z" fill="url(#logo-grad-a)" />

    <!-- Subtle Tech Accent Node -->
    <circle cx="24" cy="7" r="2.5" fill="#20D6C7" filter="url(#glow)" />
  </g>

  <!-- Brand Typography -->
  <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#F5F7FB">NAWENCE</text>
  <text x="134" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1" fill="#7C5CFF">LTD</text>
